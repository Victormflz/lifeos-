<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>LifeOS</title>
    <meta name="description" content="Tu centro de control diario: hábitos, entreno, sueño e insights." />

    <!-- PWA / Theme -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#18181b" />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LifeOS" />
    <!-- apple-touch-icon: idealmente 180×180. Usar icon-192 hasta generar icon-180. -->
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- Evitar que iOS auto-linkee números como teléfonos -->
    <meta name="format-detection" content="telephone=no" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/icon-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
